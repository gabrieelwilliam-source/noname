<body class="property-page">

10006-01.jpg", "images": [{"url": "L10006-01.jpg", "alt": "Casa no Santo Antônio"}]}, {"listingCode": "V10004", "slug": "sobrado-3-quartos-costa-e-silva-v10004", "title": "Sobrado 3 quartos no Costa e Silva", "purpose": "compra", "city": "Joinville", "stateCode": "SC", "neighborhood": "Costa e Silva", "bedrooms": 3, "suites": 1, "bathrooms": 3, "parkingSpots": 2, "areaM2": 132, "priceFrom": 645000, "salePrice": 645000, "condoFee": 0, "iptu": 110, "description": "Sobrado novo com suíte, espaço gourmet e duas vagas.", "highlight": "Imóvel novo com acabamento contemporâneo.", "amenities": ["espaco gourmet", "suite", "2 vagas"], "imageUrl": "V10004-01.jpg", "images": [{"url": "V10004-01.jpg", "alt": "Sobrado no Costa e Silva"}]}, {"listingCode": "V10008", "slug": "apartamento-2-quartos-anita-garibaldi-v10008", "title": "Apartamento 2 quartos no Anita Garibaldi", "purpose": "compra", "city": "Joinville", "stateCode": "SC", "neighborhood": "Anita Garibaldi", "bedrooms": 2, "suites": 1, "bathrooms": 2, "parkingSpots": 1, "areaM2": 71, "priceFrom": 535000, "salePrice": 535000, "condoFee": 470, "iptu": 105, "description": "Apartamento novo com suíte, sacada e lazer.", "highlight": "Boa relação entre localização, padrão e liquidez.", "amenities": ["sacada", "elevador", "salao de festas"], "imageUrl": "V10008-01.jpg", "images": [{"url": "V10008-01.jpg", "alt": "Apartamento no Anita Garibaldi"}]}, {"listingCode": "C10007", "slug": "sala-comercial-centro-c10007", "title": "Sala comercial no Centro", "purpose": "locacao", "city": "Joinville", "stateCode": "SC", "neighborhood": "Centro", "bedrooms": 0, "suites": 0, "bathrooms": 1, "parkingSpots": 1, "areaM2": 48, "priceFrom": 2400, "rentValue": 2400, "condoFee": 620, "iptu": 135, "description": "Sala comercial pronta para escritório ou consultório.", "highlight": "Endereço central, recepção e uma vaga.", "amenities": ["recepcao", "elevador", "vaga"], "imageUrl": "C10007-01.jpg", "images": [{"url": "C10007-01.jpg", "alt": "Sala comercial no Centro"}]}, {"listingCode": "V10002", "slug": "casa-3-quartos-gloria-v10002", "title": "Casa 3 quartos no Glória", "purpose": "compra", "city": "Joinville", "stateCode": "SC", "neighborhood": "Glória", "bedrooms": 3, "suites": 1, "bathrooms": 2, "parkingSpots": 2, "areaM2": 146, "priceFrom": 720000, "salePrice": 720000, "condoFee": 0, "iptu": 165, "description": "Casa com quintal privativo, churrasqueira e duas vagas.", "highlight": "Quintal privativo e duas vagas em rua residencial.", "amenities": ["quintal", "churrasqueira", "lavanderia", "2 vagas"], "imageUrl": "V10002-01.jpg", "images": [{"url": "V10002-01.jpg", "alt": "Casa no Glória"}]}];

      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function money(v){v=Number(v||0);return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
      function imgPath(v){v=String(v||'').trim();var m=v.match(/(?:^|\/)(?:demo\/imoveis|assets)\/([^/?#]+\.(?:jpg|jpeg|png|webp|svg))/i);return m?m[1]:v}
      function purposeLabel(p){p=String(p||'').toLowerCase();return p==='locacao'?'Aluguel':p==='investimento'?'Investimento':'Venda'}
      function price(p){return p.purpose==='locacao'?money(p.rentValue||p.priceFrom)+'/mês':money(p.salePrice||p.priceFrom)}

      function collectArrays(obj, depth, out, seen){
        if(!obj || typeof obj!=='object' || depth>4) return;
        seen=seen||new WeakSet(); if(seen.has(obj)) return; seen.add(obj);
        if(Array.isArray(obj)){
          if(obj.some(function(x){return x&&typeof x==='object'&&(x.listingCode||x.listing_code||x.slug)&&((x.title||x.label)||x.imageUrl)})) out.push(obj);
          obj.forEach(function(x){collectArrays(x, depth+1, out, seen)}); return;
        }
        Object.keys(obj).forEach(function(k){try{collectArrays(obj[k], depth+1, out, seen)}catch(e){}});
      }

      function catalog(){
        var arrays=[];
        ['DEMO_PROPERTIES','DEMO_CATALOG','DEMO_DATA','IMOB_DEMO_DATA','__IMOB_DEMO__','PROPERTIES','PROPERTY_DATA'].forEach(function(n){try{collectArrays(window[n],0,arrays)}catch(e){}});
        var best=[];
        arrays.forEach(function(a){a.forEach(function(p){if(p&&typeof p==='object'){var code=p.listingCode||p.listing_code||p.code||p.listingId;if(code && !best.some(function(b){return String(b.listingCode||b.listing_code||b.code||b.listingId).toUpperCase()===String(code).toUpperCase()})) best.push(p)}})});
        return best.length?best:FALLBACK;
      }

      function getRequested(){
        var q=new URLSearchParams(location.search); 
        var code=(q.get('codigo')||q.get('code')||q.get('listing')||q.get('ref')||'').toUpperCase();
        var path=decodeURIComponent(location.pathname.split('/').pop()||'').toLowerCase(); 
        return {code:code, slug:path};
      }

      function findProperty(){
        var req=getRequested(); var items=catalog();
        return items.find(function(p){return req.code && String(p.listingCode||p.listing_code||p.code||p.listingId||'').toUpperCase()===req.code}) ||
               items.find(function(p){return req.slug && String(p.slug||p.listingUrl||'').toLowerCase().includes(req.slug)}) ||
               items[0];
      }

      function render(){
        var root=document.getElementById('property-root'); var p=findProperty();
        if(!p){root.innerHTML='<section class="not-found"><h1>Imóvel não encontrado</h1><p>Volte ao catálogo e escolha outra opção.</p><p><a class="button button-primary" href="index.html#catalogo">Voltar ao catálogo</a></p></section>';return;}
        var imgs=(Array.isArray(p.images)&&p.images.length?p.images:[{url:p.imageUrl,alt:p.title||p.label}]).map(function(i){return {url:imgPath(i.url||i.imageUrl||p.imageUrl),alt:i.alt||p.title||p.label}});
        var main=imgs[0]||{url:'property-fallback.jpg',alt:p.title||p.label};
        document.title=(p.title||p.label||'Imóvel')+' | Horizonte Prime Imóveis';
        var code=p.listingCode||p.listing_code||p.code||p.listingId||'';
        var whats=(window.SITE_CONFIG&&window.SITE_CONFIG.WHATSAPP_NUMBER)||'554799762742';
        var msg=encodeURIComponent('Olá, tenho interesse no imóvel '+code+' - '+(p.title||p.label||''));
        root.innerHTML = '<section class="property-top">'+
          '<div class="property-breadcrumb">Início › Imóveis › '+esc(p.title||p.label||'Imóvel')+'</div>'+
          '<div class="property-title-row"><div><div class="property-badges"><span class="pill pill-dark">'+esc(purposeLabel(p.purpose))+'</span><span class="pill pill-soft">Código '+esc(code)+'</span></div><h1>'+esc(p.title||p.label||'Imóvel')+'</h1><div class="property-location">'+esc([p.neighborhood,p.city,p.stateCode].filter(Boolean).join(', ').replace(', SC', ' - SC'))+'</div></div><a class="share-btn" href="'+esc(location.href)+'" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);return false" title="Copiar link">🔗</a></div>'+
          '<div class="property-hero-image"><img id="main-property-image" src="'+esc(main.url)+'" alt="'+esc(main.alt)+'" onerror="this.onerror=null;this.src=\'property-fallback.jpg\'"></div>'+
          (imgs.length>1?'<div class="thumbs">'+imgs.map(function(im){return '<button type="button" data-img="'+esc(im.url)+'"><img src="'+esc(im.url)+'" alt="'+esc(im.alt)+'"></button>'}).join('')+'</div>':'')+
          '</section>'+
          '<section class="property-body"><div><div class="property-stats">'+
          '<div class="property-stat"><strong>'+esc(p.bedrooms||0)+'</strong><span>Quartos</span></div>'+
          '<div class="property-stat"><strong>'+esc(p.suites||0)+'</strong><span>Suíte</span></div>'+
          '<div class="property-stat"><strong>'+esc(p.bathrooms||0)+'</strong><span>Banheiros</span></div>'+
          '<div class="property-stat"><strong>'+esc(p.parkingSpots||p.parking_spots||0)+'</strong><span>Vagas</span></div>'+
          '<div class="property-stat"><strong>'+esc(p.areaM2||p.area_m2||0)+' m²</strong><span>Área privativa</span></div>'+
          '</div><div class="property-section"><h2>Sobre este imóvel</h2><p>'+esc(p.description||p.highlight||'Imóvel selecionado em Joinville.')+'</p><p>'+esc(p.highlight||'')+'</p>'+
          (Array.isArray(p.amenities)&&p.amenities.length?'<div class="amenities">'+p.amenities.map(function(a){return '<span class="amenity">'+esc(a)+'</span>'}).join('')+'</div>':'')+
          '</div></div><aside><div class="price-card"><small>Valor do imóvel</small><strong>'+esc(price(p))+'</strong>'+
          (p.condoFee?'<small>Condomínio '+esc(money(p.condoFee))+'</small><br>':'')+(p.iptu?'<small>IPTU '+esc(money(p.iptu))+'</small>':'')+
          '<a class="button button-primary" target="_blank" rel="noopener" href="https://wa.me/'+esc(String(whats).replace(/\D/g,''))+'?text='+msg+'">Tenho interesse</a></div></aside></section>';
        document.querySelectorAll('.thumbs button').forEach(function(btn){btn.addEventListener('click',function(){document.getElementById('main-property-image').src=btn.getAttribute('data-img')})});
      }

      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', render); else render();
    })();
